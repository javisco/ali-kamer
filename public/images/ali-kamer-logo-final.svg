<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 1000"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Ali-Kamer — Acheter, vendez sans stress</title>
  <desc id="desc">Logo Ali-Kamer aux couleurs vert, rouge et jaune, construit au Cameroun pour l'Afrique.</desc>

  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#009447"/>
      <stop offset="1" stop-color="#006B32"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0192B"/>
      <stop offset="1" stop-color="#CE1126"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD21A"/>
      <stop offset="1" stop-color="#F0B900"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity=".14"/>
    </filter>

    <style>
      .brand {
        font-family: "Montserrat", "Arial Black", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .tagline {
        font-family: "Montserrat", Arial, sans-serif;
        font-weight: 500;
      }
      .country {
        font-family: "Montserrat", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: .5px;
      }
    </style>
  </defs>

  <!-- =========================================================
       EMBLÈME AK
  ========================================================== -->
  <g transform="translate(150 55)" filter="url(#shadow)">

    <!-- A vert -->
    <path
      d="M55 430
         L260 85
         Q285 45 335 45
         L390 45
         L500 430
         L390 430
         L355 335
         L245 335
         L205 430 Z
         M275 250
         L340 250
         L310 165 Z"
      fill="url(#green)"
      fill-rule="evenodd"/>

    <!-- I rouge -->
    <path
      d="M390 45
         L515 45
         L515 430
         L390 430 Z"
      fill="url(#red)"/>

    <!-- K jaune -->
    <path
      d="M515 45
         L640 45
         L535 205
         L690 430
         L555 430
         L485 315
         L515 265 Z"
      fill="url(#yellow)"/>

    <!-- Courbe verte arrière -->
    <path
      d="M10 430
         C115 315 235 325 350 285
         C450 250 505 205 600 120
         C560 205 505 295 420 340
         C300 405 170 380 10 430 Z"
      fill="#00843D"/>

    <!-- Courbe rouge principale -->
    <path
      d="M0 430
         C125 300 270 330 395 285
         C485 253 540 215 605 145
         C555 255 480 330 385 365
         C250 415 120 355 0 430 Z"
      fill="url(#red)"/>

    <!-- Fine ligne blanche séparatrice -->
    <path
      d="M7 414
         C135 294 270 320 397 278
         C485 249 540 211 600 145
         C550 263 475 337 385 370
         C250 420 125 350 7 414 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"/>
  </g>

  <!-- =========================================================
       NOM DE MARQUE
  ========================================================== -->
  <text x="600" y="675"
        text-anchor="middle"
        class="brand"
        font-size="126"
        fill="url(#green)">
    ALI<tspan fill="#CE1126">-</tspan>KAMER
  </text>

  <!-- =========================================================
       SLOGAN PRINCIPAL
  ========================================================== -->
  <g transform="translate(600 745)">
    <line x1="-500" y1="0" x2="-390" y2="0"
          stroke="#00843D" stroke-width="7" stroke-linecap="round"/>
    <line x1="390" y1="0" x2="500" y2="0"
          stroke="#FCD116" stroke-width="7" stroke-linecap="round"/>

    <text x="0" y="13"
          text-anchor="middle"
          class="tagline"
          font-size="38"
          fill="#222222">
      Acheter, vendez sans stress
    </text>
  </g>

  <!-- =========================================================
       SIGNATURE / POSITIONNEMENT
  ========================================================== -->
  <g transform="translate(600 820)">
    <circle cx="-255" cy="-9" r="5" fill="#CE1126"/>
    <circle cx="255" cy="-9" r="5" fill="#CE1126"/>

    <text x="0" y="5"
          text-anchor="middle"
          class="country"
          font-size="30"
          fill="#00843D">
      Construit au Cameroun pour l'Afrique
    </text>
  </g>

  <!-- Petit rappel des trois couleurs -->
  <g transform="translate(535 865)">
    <rect x="0" y="0" width="43" height="7" rx="3.5" fill="#00843D"/>
    <rect x="57" y="0" width="43" height="7" rx="3.5" fill="#CE1126"/>
    <rect x="114" y="0" width="43" height="7" rx="3.5" fill="#FCD116"/>
  </g>
</svg>
